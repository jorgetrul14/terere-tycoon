name: Compilar app Android

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk-de-prueba:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm install

      - name: Crear el proyecto de Android
        run: npx cap add android

      - name: Conectar AdMob
        run: python3 scripts/patch-android.py
        env:
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}

      - name: Copiar el juego al proyecto
        run: npx cap sync android

      - name: Compilar el APK de prueba
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Publicar el APK para descargarlo desde el celular
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk terere-tycoon-prueba.apk
          gh release create "prueba-${{ github.run_number }}" terere-tycoon-prueba.apk \
            --repo "${{ github.repository }}" \
            --title "Prueba ${{ github.run_number }}" \
            --notes "APK de prueba con anuncios reales de AdMob. No toques los anuncios en tu propio celular." \
            --prerelease
